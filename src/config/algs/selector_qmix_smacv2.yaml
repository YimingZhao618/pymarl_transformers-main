# Train once per map and seed; reuse the final mixer.th for every method.
# This selector sees the same adapter state used by TransfQMix recovery.
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

runner: parallel
batch_size_run: 8
buffer_size: 5000
batch_size: 32
target_update_interval: 200

mac: n_mac
agent: n_rnn
agent_output_type: q
learner: nq_learner
mixer: qmix
mixing_embed_dim: 32
hypernet_embed: 64
q_lambda: False
use_layer_norm: False
use_orthogonal: False
gain: 0.01

obs_agent_id: True
obs_last_action: True
save_model: True
save_model_interval: 5000000
t_max: 5000000
test_nepisode: 32
test_interval: 10000
name: selector_qmix_smacv2
